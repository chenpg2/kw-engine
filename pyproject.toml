[project]
name = "kw-engine"
version = "0.1.0"
description = "Knowledge engine substrate — pydantic models, SQLite index, CLI"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
kw = "kw_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kw_engine"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
