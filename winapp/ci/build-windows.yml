# GitHub Actions 模板：自动构建 KWEngine.exe
# 启用方法：把本文件复制到仓库的 .github/workflows/build-windows.yml，push 即触发。
# 构建产物在 Actions 页面的 Artifacts 中下载（KWEngine-windows.zip）。

name: Build Windows exe

on:
  push:
    paths:
      - "winapp/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: winapp
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build exe
        working-directory: winapp
        run: pyinstaller kwengine.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KWEngine-windows
          path: winapp/dist/KWEngine.exe
