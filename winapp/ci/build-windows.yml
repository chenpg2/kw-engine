# 模板备份 — 实际生效的工作流在仓库根部 .github/workflows/build-windows.yml
# （此副本仅供单独取用 winapp/ 时参考，两边内容保持一致。）

name: Build Windows exe

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
    paths:
      - "winapp/**"
      - ".github/workflows/build-windows.yml"
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: winapp
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build exe
        working-directory: winapp
        run: pyinstaller kwengine.spec --noconfirm

      - name: Smoke check
        working-directory: winapp
        run: |
          if (!(Test-Path dist/KWEngine.exe)) { exit 1 }
          Get-Item dist/KWEngine.exe | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KWEngine-windows
          path: winapp/dist/KWEngine.exe

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: winapp/dist/KWEngine.exe
