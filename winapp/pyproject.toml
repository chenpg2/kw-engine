[project]
name = "kwengine-app"
version = "1.0.0"
description = "KW Engine desktop app (Windows/cross-platform) — distill, abstract, synthesize, search by problem structure"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "PyYAML>=6.0",
    "pypdf>=4.0",
    "requests>=2.31",
    "keyring>=24.0",
]

[project.scripts]
kwengine-app = "kwengine_app.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
